<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t-pagetitle">La Remake List - GD</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --accent: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Partículas de GD de fondo */
        .gd-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -50px;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        header {
            background-color: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; color: var(--accent); }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botones de Idioma */
        .lang-group {
            display: flex;
            background: #111;
            border-radius: 6px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--accent);
            color: #000;
        }

        .btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-admin { background: linear-gradient(135deg, #f7b733, #fc4a1a); color: #000; }

        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }

        /* Tarjetas de Niveles */
        .level-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .thumbnail { width: 110px; height: 62px; object-fit: cover; border-radius: 6px; margin-right: 15px; background: #000; }
        .level-info { flex-grow: 1; }
        .level-title { font-size: 1.2rem; font-weight: bold; margin: 0 0 4px 0; }
        .level-creator { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
        .level-points { font-weight: bold; color: #00ffcc; font-size: 1.1rem; }

        /* Panel exclusivo Admin */
        .admin-panel {
            background: #181818;
            border: 1px dashed var(--accent);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #141414;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        .close-btn { position: absolute; top: 12px; right: 18px; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; border-radius: 6px; border: 1px solid #333; background: #0a0a0a; color: white; box-sizing: border-box; }
        
        .profile-preview { display: flex; align-items: center; gap: 12px; background: #1c1c1c; padding: 8px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a2a; }
        .avatar-circle { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #333; }
    </style>
</head>
<body>

<!-- Fondo de partículas flotantes (estilo GD) -->
<div class="gd-particles" id="particleContainer"></div>

<header>
    <h1 id="t-title">LA REMAKE LIST</h1>
    <div class="header-controls">
        <!-- Botones de Idioma -->
        <div class="lang-group">
            <button class="lang-btn active" onclick="setLanguage('es', this)">ES</button>
            <button class="lang-btn" onclick="setLanguage('en', this)">US</button>
            <button class="lang-btn" onclick="setLanguage('ru', this)">RU</button>
        </div>
        <div id="authContainer">
            <button class="btn" id="loginBtn" onclick="openProfileModal()">Iniciar sesión</button>
        </div>
    </div>
</header>

<div class="container">
    <!-- Panel exclusivo para Administrador -->
    <div id="adminPanel" class="admin-panel">
        <h3 id="t-admintitle" style="margin-top:0; color:var(--accent);">Panel de Administrador</h3>
        <form id="levelForm">
            <input type="text" id="lvlName" placeholder="Nombre del nivel" required>
            <input type="text" id="lvlCreator" placeholder="Creador" required>
            <input type="text" id="lvlVerifier" placeholder="Verificador" required>
            <input type="text" id="lvlId" placeholder="ID de Geometry Dash" required>
            <input type="text" id="lvlYoutube" placeholder="ID de YouTube (ej: 9fsZ014qB3s)" required>
            <input type="number" id="lvlRank" placeholder="Puesto en el Top (Ej: 1)" required>
            <button type="submit" class="btn" id="t-addbtn" style="width:100%;">Añadir Nivel a la Lista</button>
        </form>
    </div>

    <!-- Lista principal de niveles -->
    <div id="demonList"></div>
</div>

<!-- Modal para Configurar Perfil -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <h2 id="t-profiletitle" style="margin-top:0;">Configura tu Perfil</h2>
        <form id="profileForm">
            <label id="t-profilename">Tu Nombre de Usuario en GD:</label>
            <input type="text" id="profileName" required placeholder="Introducir">

            <label id="t-profileimg">Imagen de tu perfil (URL o archivo):</label>
            <input type="url" id="profileImgUrl" placeholder="https://...">

            <button type="submit" class="btn" id="t-saveprofile" style="width:100%; margin-top:10px;">Guardar Perfil</button>
        </form>
    </div>
</div>

<!-- Modal de Contraseña de Administrador -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAdminModal()">&times;</span>
        <h3 style="margin-top:0;" id="t-admintitlemodal">Acceso de Administrador</h3>
        <form id="adminPassForm">
            <input type="password" id="adminPassInput" required placeholder="Contraseña de Admin">
            <button type="submit" class="btn btn-admin" id="t-adminbtnsubmit" style="width:100%;">Verificar</button>
        </form>
    </div>
</div>

<!-- SDK de Firebase Firestore -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_PROYECTO.firebaseapp.com",
        projectId: "TU_PROYECTO",
        storageBucket: "TU_PROYECTO.appspot.com",
        messagingSenderId: "TU_ID",
        appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "6767XDXD";

    const translations = {
        es: {
            pagetitle: "La Remake List - GD",
            title: "LA REMAKE LIST",
            login: "Iniciar sesión",
            logout: "Cerrar sesión",
            adminbtntext: "Admin",
            admintitle: "Panel de Administrador",
            addbtn: "Añadir Nivel a la Lista",
            admintitlemodal: "Acceso de Administrador",
            adminbtnsubmit: "Verificar",
            profiletitle: "Configura tu Perfil",
            profilename: "Tu Nombre de Usuario en GD:",
            placeholdername: "Introducir",
            profileimg: "Imagen de tu perfil (URL):",
            saveprofile: "Guardar Perfil",
            verifiedBy: "Verificado por",
            by: "Por"
        },
        en: {
            pagetitle: "La Remake List - GD",
            title: "LA REMAKE LIST",
            login: "Sign in",
            logout: "Log out",
            adminbtntext: "Admin",
            admintitle: "Admin Panel",
            addbtn: "Add Level to List",
            admintitlemodal: "Admin Access",
            adminbtnsubmit: "Verify",
            profiletitle: "Configure Profile",
            profilename: "Your GD Username:",
            placeholdername: "Enter",
            profileimg: "Profile picture (URL):",
            saveprofile: "Save Profile",
            verifiedBy: "Verified by",
            by: "By"
        },
        ru: {
            pagetitle: "La Remake List - GD",
            title: "LA REMAKE LIST",
            login: "Войти",
            logout: "Выйти",
            adminbtntext: "Админ",
            admintitle: "Панель администратора",
            addbtn: "Добавить уровень",
            admintitlemodal: "Доступ администратора",
            adminbtnsubmit: "Проверить",
            profiletitle: "Настройка профиля",
            profilename: "Ваш ник в GD:",
            placeholdername: "Ввести",
            profileimg: "Картинка профиля (URL):",
            saveprofile: "Сохранить профиль",
            verifiedBy: "Проверил",
            by: "От"
        }
    };

    let currentLang = 'es';

    window.setLanguage = (lang, btnElement) => {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        document.getElementById('t-pagetitle').innerText = translations[lang].pagetitle;
        document.getElementById('t-title').innerText = translations[lang].title;
        document.getElementById('t-admintitle').innerText = translations[lang].admintitle;
        document.getElementById('t-addbtn').innerText = translations[lang].addbtn;
        document.getElementById('t-admintitlemodal').innerText = translations[lang].admintitlemodal;
        document.getElementById('t-adminbtnsubmit').innerText = translations[lang].adminbtnsubmit;
        document.getElementById('t-profiletitle').innerText = translations[lang].profiletitle;
        document.getElementById('t-profilename').innerText = translations[lang].profilename;
        document.getElementById('profileName').placeholder = translations[lang].placeholdername;
        document.getElementById('t-profileimg').innerText = translations[lang].profileimg;
        document.getElementById('t-saveprofile').innerText = translations[lang].saveprofile;

        const loginBtnEl = document.getElementById('loginBtn');
        if (loginBtnEl) loginBtnEl.innerText = translations[lang].login;
        const logoutBtnEl = document.getElementById('logoutBtn');
        if (logoutBtnEl) logoutBtnEl.innerText = translations[lang].logout;
        const adminBtnEl = document.getElementById('adminAccessBtn');
        if (adminBtnEl) adminBtnEl.innerText = translations[lang].adminbtntext;

        loadLevels();
    };

    // Partículas de fondo
    const particleContainer = document.getElementById('particleContainer');
    for (let i = 0; i < 22; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 4 + 'px';
        p.style.width = size;
        p.style.height = size;
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 6 + 4) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's';
        particleContainer.appendChild(p);
    }

    function checkLocalStorageSession() {
        const savedProfile = localStorage.getItem('gd_profile');
        const isAdmin = localStorage.getItem('gd_is_admin') === 'true';
        const authContainer = document.getElementById('authContainer');
        const adminPanel = document.getElementById('adminPanel');

        if (savedProfile) {
            const profile = JSON.parse(savedProfile);
            let avatarHtml = `<img src="${profile.imageUrl || 'https://via.placeholder.com/34'}" class="avatar-circle" onerror="this.src='https://via.placeholder.com/34'">`;

            let adminButtonHtml = '';
            if (!isAdmin) {
                adminButtonHtml = `<button class="btn btn-admin" id="adminAccessBtn" onclick="openAdminModal()" style="padding:6px 10px; font-size:0.8rem;">${translations[currentLang].adminbtntext}</button>`;
            } else {
                adminPanel.style.display = 'block';
            }

            authContainer.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="profile-preview" onclick="openProfileModal()">
                        ${avatarHtml}
                        <span style="font-size:0.9rem; font-weight:bold;">${profile.name}</span>
                    </div>
                    ${adminButtonHtml}
                    <button class="btn btn-danger" onclick="logoutProfile()" style="padding:6px 10px; font-size:0.8rem;">${translations[currentLang].logout}</button>
                </div>
            `;
        } else {
            authContainer.innerHTML = `<button class="btn" id="loginBtn" onclick="openProfileModal()">${translations[currentLang].login}</button>`;
            adminPanel.style.display = 'none';
        }
    }

    window.openProfileModal = () => {
        const savedProfile = localStorage.getItem('gd_profile');
        if (savedProfile) {
            const profile = JSON.parse(savedProfile);
            document.getElementById('profileName').value = profile.name;
            document.getElementById('profileImgUrl').value = profile.imageUrl || '';
        } else {
            document.getElementById('profileName').value = "";
            document.getElementById('profileImgUrl').value = "";
        }
        document.getElementById('profileModal').style.display = 'flex';
    };

    document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('profileName').value;
        const imageUrl = document.getElementById('profileImgUrl').value;
        let profileData = { name, imageUrl };

        localStorage.setItem('gd_profile', JSON.stringify(profileData));
        document.getElementById('profileModal').style.display = 'none';
        checkLocalStorageSession();
    });

    window.logoutProfile = () => {
        localStorage.removeItem('gd_profile');
        localStorage.removeItem('gd_is_admin');
        checkLocalStorageSession();
        location.reload();
    };

    window.openAdminModal = () => {
        document.getElementById('adminModal').style.display = 'flex';
    };

    window.closeAdminModal = () => {
        document.getElementById('adminModal').style.display = 'none';
    };

    document.getElementById('adminPassForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const pass = document.getElementById('adminPassInput').value;
        if (pass === ADMIN_PASSWORD) {
            localStorage.setItem('gd_is_admin', 'true');
            alert("¡Acceso de administrador concedido para siempre!");
            closeAdminModal();
            checkLocalStorageSession();
        } else {
            alert("Contraseña incorrecta.");
        }
        document.getElementById('adminPassInput').value = '';
    });

    async function loadLevels() {
        const listContainer = document.getElementById('demonList');
        try {
            const q = query(collection(db, "levels"), orderBy("rank", "asc"));
            const querySnapshot = await getDocs(q);
            
            listContainer.innerHTML = "";
            if (querySnapshot.empty) {
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const lvl = docSnap.data();
                const points = Math.max(10, Math.round(350 * Math.pow(0.95, lvl.rank - 1)));
                const thumbUrl = `https://img.youtube.com/vi/${lvl.youtubeId}/mqdefault.jpg`;
                const tr = translations[currentLang];

                const card = document.createElement('div');
                card.className = 'level-card';
                card.innerHTML = `
                    <img src="${thumbUrl}" class="thumbnail">
                    <div class="level-info">
                        <h3 class="level-title"><span style="color:var(--accent);">#${lvl.rank}</span> ${lvl.name}</h3>
                        <p class="level-creator">${tr.by} ${lvl.creator} • ${tr.verifiedBy} ${lvl.verifier}</p>
                    </div>
                    <div class="level-points">${points} pts</div>
                `;
                listContainer.appendChild(card);
            });
        } catch (e) {
            console.error(e);
            listContainer.innerHTML = "<p style='text-align:center; color:red;'>Error al cargar los niveles.</p>";
        }
    }

    const levelForm = document.getElementById('levelForm');
    if (levelForm) {
        levelForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const isAdmin = localStorage.getItem('gd_is_admin') === 'true';
            if (!isAdmin) return;

            await addDoc(collection(db, "levels"), {
                name: document.getElementById('lvlName').value,
                creator: document.getElementById('lvlCreator').value,
                verifier: document.getElementById('lvlVerifier').value,
                levelId: document.getElementById('lvlId').value,
                youtubeId: document.getElementById('lvlYoutube').value,
                rank: Number(document.getElementById('lvlRank').value)
            });

            levelForm.reset();
            loadLevels();
        });
    }

    checkLocalStorageSession();
    loadLevels();
</script>
</body>
</html>
