<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t-pagetitle">The Remake List - GD</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --accent: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .gd-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -50px;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        header {
            background-color: rgba(15, 15, 15, 0.92);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.45rem;
            letter-spacing: 2px;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-tabs, .lang-group {
            display: flex;
            background: #111;
            border-radius: 6px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .nav-tab-btn, .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nav-tab-btn.active, .lang-btn.active {
            background: var(--accent);
            color: #000;
        }

        .social-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            padding: 0;
            transition: transform 0.2s;
        }

        .social-btn:hover { transform: scale(1.08); }
        .discord-bg { background-color: #5865F2; }
        .tiktok-bg { background-color: #000000; border: 1px solid #333; }
        .submit-bg { background-color: #1c1c1c; border: 1px solid #444; }
        .social-icon { width: 20px; height: 20px; fill: white; }

        .btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover { opacity: 0.88; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-edit { background: linear-gradient(135deg, #f7b733, #f39c12); color: #000; padding: 6px 12px; font-size: 0.85rem; }
        .btn-copy { background: #222; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-action-bar {
            display: none;
            gap: 10px;
        }

        .corner-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .lista-vertical {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .lista-horizontal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }

        .level-card {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border-left: 6px solid var(--accent);
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            overflow: hidden;
            cursor: pointer;
        }

        .lista-horizontal .level-card {
            flex-direction: column;
            align-items: stretch;
            border-left: none;
            border-top: 6px solid var(--accent);
        }

        .level-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--card-bg-img);
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.35);
            z-index: 1;
        }

        .level-card > * {
            position: relative;
            z-index: 2;
        }

        .thumbnail {
            width: 135px;
            height: 78px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 18px;
            background: #000;
            flex-shrink: 0;
        }

        .lista-horizontal .thumbnail {
            width: 100%;
            height: 125px;
            margin-right: 0;
            margin-bottom: 10px;
        }

        .level-info { flex-grow: 1; }
        .level-title { margin: 0 0 5px 0; font-size: 1.25rem; font-weight: bold; }
        .level-creator { margin: 0; color: #ccc; font-size: 0.9rem; }
        .level-points { font-weight: bold; color: #00ffcc; font-size: 1.15rem; margin-left: 15px; white-space: nowrap; }
        .level-actions { display: flex; gap: 8px; margin-left: 15px; flex-wrap: wrap; }

        .lista-horizontal .level-points,
        .lista-horizontal .level-actions {
            margin-left: 0;
            margin-top: 10px;
        }

        .player-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            margin-bottom: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            gap: 10px;
            flex-wrap: wrap;
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 6px;
            background: #333;
            flex-shrink: 0;
        }

        .player-rank {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent);
            width: 35px;
        }

        .player-info { flex-grow: 1; }
        .player-name { margin: 0 0 3px 0; font-size: 1.1rem; font-weight: bold; }
        .player-details { margin: 0; color: var(--text-muted); font-size: 0.85rem; }
        .player-points { font-weight: bold; color: #00ffcc; font-size: 1.05rem; margin-right: 6px; }
        .player-actions { display: flex; gap: 8px; align-items: center; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #141414;
            border: 1px solid #333;
            padding: 22px;
            border-radius: 12px;
            max-width: 460px;
            width: 100%;
            position: relative;
            max-height: 88vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0 14px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: white;
            box-sizing: border-box;
        }

        .modal-yt-thumb {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .victors-section {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 14px;
            border: 1px solid #333;
        }

        .victors-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .victors-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .victor-badge {
            background: #242424;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .victor-del {
            color: #ff416c;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="gd-particles" id="particleContainer"></div>

<header>
    <h1 id="t-title">THE REMAKE LIST</h1>

    <div class="header-controls">
        <div class="nav-tabs">
            <button type="button" class="nav-tab-btn active" id="tabListBtn" onclick="switchTab('list')">List</button>
            <button type="button" class="nav-tab-btn" id="tabPlayersBtn" onclick="switchTab('players')">Players</button>
        </div>

        <button type="button" class="social-btn submit-bg" onclick="openModal('submitInfoModal')" title="Submit Info">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M12 2L5 9h4v8h6V9h4L12 2zm-7 19v-2h14v2H5z"/></svg>
        </button>

        <button type="button" class="social-btn discord-bg" onclick="handleDiscordClick()" title="Discord">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/></svg>
        </button>

        <button type="button" class="social-btn tiktok-bg" onclick="handleTiktokClick()" title="TikTok">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>
        </button>

        <div class="lang-group">
            <button type="button" class="lang-btn active" id="btnLangUS" onclick="setLanguage('en')">🇺🇸</button>
            <button type="button" class="lang-btn" id="btnLangES" onclick="setLanguage('es')">🇪🇸</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="top-toolbar">
        <div id="adminActionBar" class="admin-action-bar">
            <button type="button" class="btn" id="addLevelBtnText" onclick="openModal('addLevelModal')">+ Add Level</button>
        </div>
        <div class="corner-actions">
            <button type="button" class="btn" id="toggleViewBtn" onclick="toggleListViewMode()" style="background:#222; border:1px solid var(--accent); color:var(--accent);">View: Vertical</button>
        </div>
    </div>

    <div id="listViewContainer"><div id="demonList" class="lista-vertical"></div></div>
    <div id="playersViewContainer" style="display:none;"><div id="playersList"></div></div>
</div>

<datalist id="playersDatalist"></datalist>

<!-- Admin Modal -->
<div id="adminAuthModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('adminAuthModal')">&times;</span>
        <h3 id="m-admin-title" style="margin-top:0; color:var(--accent);">Admin Access</h3>
        <form onsubmit="handleAdminLogin(event)">
            <label id="m-admin-label">Admin Password:</label>
            <input type="password" id="adminPassInput" required>
            <button type="submit" class="btn" id="m-admin-submit" style="width:100%;">Unlock Admin</button>
        </form>
    </div>
</div>

<!-- Submit Info Modal -->
<div id="submitInfoModal" class="modal">
    <div class="modal-content" style="text-align:center;">
        <span class="close-btn" onclick="closeModal('submitInfoModal')">&times;</span>
        <h3 id="m-sub-title" style="margin-top:0; color:var(--accent);">Submission Info</h3>
        <p id="m-sub-text" style="color:#ccc;">Hello, to add levels or be a victor of a level you have to send it in Discord, thanks!</p>
        <button type="button" class="btn" id="m-sub-close" onclick="closeModal('submitInfoModal')" style="width:100%;">Understood</button>
    </div>
</div>

<!-- Discord Modal -->
<div id="discordModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('discordModal')">&times;</span>
        <h3 id="m-disc-title" style="margin-top:0; color:var(--accent);">Configure Discord Invite</h3>
        <form onsubmit="handleSaveDiscordUrl(event)">
            <label id="m-disc-label">Discord Server URL:</label>
            <input type="url" id="discordUrlInput" required>
            <button type="submit" class="btn" id="m-disc-save" style="width:100%;">Save & Upload to Cloud</button>
        </form>
    </div>
</div>

<!-- TikTok Modal -->
<div id="tiktokModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('tiktokModal')">&times;</span>
        <h3 id="m-tik-title" style="margin-top:0; color:var(--accent);">Configure TikTok Link</h3>
        <form onsubmit="handleSaveTiktokUrl(event)">
            <label id="m-tik-label">TikTok Profile URL:</label>
            <input type="url" id="tiktokUrlInput" required>
            <button type="submit" class="btn" id="m-tik-save" style="width:100%;">Save & Upload to Cloud</button>
        </form>
    </div>
</div>

<!-- Add Level Modal -->
<div id="addLevelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('addLevelModal')">&times;</span>
        <h3 id="m-add-title" style="margin-top:0; color:var(--accent);">Add Level</h3>
        <form onsubmit="handleAddNewLevel(event)">
            <input type="text" id="lvlName" placeholder="Level Name" required>
            <input type="text" id="lvlCreator" placeholder="Creator" required>
            <input type="text" id="lvlVerifier" list="playersDatalist" placeholder="Verifier" required>
            <input type="text" id="lvlId" placeholder="GD Level ID" required>
            <input type="number" id="lvlRank" placeholder="Rank (Ex: 1)" required>
            <input type="url" id="lvlYoutube" placeholder="YouTube URL" required>
            <label id="m-add-nong">Uses NONG song?</label>
            <select id="lvlNongSelect">
                <option value="no" id="opt-nong-no">No</option>
                <option value="yes" id="opt-nong-yes">Yes</option>
            </select>
            <button type="submit" class="btn" id="m-add-submit" style="width:100%;">Add Level to List</button>
        </form>
    </div>
</div>

<!-- Edit Level Modal -->
<div id="editLevelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('editLevelModal')">&times;</span>
        <h3 id="m-edit-title" style="margin-top:0; color:var(--accent);">Edit Level</h3>
        <form onsubmit="handleEditLevel(event)">
            <input type="hidden" id="editLvlIdKey">
            <input type="text" id="editLvlName" required>
            <input type="text" id="editLvlCreator" required>
            <input type="text" id="editLvlVerifier" list="playersDatalist" required>
            <input type="text" id="editLvlCodeId" required>
            <input type="number" id="editLvlRank" required>
            <input type="url" id="editLvlYoutube" required>
            <select id="editLvlNongSelect">
                <option value="no" id="edit-opt-nong-no">No</option>
                <option value="yes" id="edit-opt-nong-yes">Yes</option>
            </select>
            <button type="submit" class="btn" id="m-edit-submit" style="width:100%;">Save Changes</button>
        </form>
    </div>
</div>

<!-- Player Photo Only Modal (Admin) -->
<div id="editPlayerPhotoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('editPlayerPhotoModal')">&times;</span>
        <h3 id="m-player-photo-title" style="margin-top:0; color:var(--accent);">Change Player Photo</h3>
        <form onsubmit="handleSavePlayerPhoto(event)">
            <input type="hidden" id="editPlayerNameKey">
            <p id="editPlayerNameDisplay" style="margin:0 0 12px 0; font-weight:bold;"></p>
            <label id="m-player-photo-label">New Photo:</label>
            <input type="file" id="playerPhotoFile" accept="image/*" required>
            <button type="submit" class="btn" id="m-player-photo-save" style="width:100%;">Save Photo</button>
        </form>
    </div>
</div>

<!-- Level Detail Modal -->
<div id="levelDetailModal" class="modal">
    <div class="modal-content" style="text-align:center;">
        <span class="close-btn" onclick="closeModal('levelDetailModal')">&times;</span>
        <h3 id="modalLevelTitle" style="color:var(--accent); margin-top:0;"></h3>
        <p id="modalLevelCreators" style="color:var(--text-muted); font-size:0.9rem;"></p>
        <a id="modalYoutubeAnchor" href="#" target="_blank">
            <img id="modalYoutubeThumbImg" src="" class="modal-yt-thumb" alt="Thumbnail">
        </a>
        <div style="background:#1c1c1c; padding:10px 14px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
            <span id="modalLevelIdText" style="font-weight:bold;">ID: </span>
            <button type="button" class="btn-copy" id="m-copy-btn" onclick="copyLevelId()">Copy ID</button>
        </div>
        <div class="victors-section">
            <div class="victors-header">
                <strong id="m-victors-title" style="color:var(--accent);">Victors</strong>
                <button type="button" class="btn" id="addVictorBtn" onclick="handleAddVictor()" style="display:none; font-size:0.75rem; padding:4px 10px;">+ Add Victor</button>
            </div>
            <div id="modalVictorsList" class="victors-list"></div>
        </div>
    </div>
</div>

<script>
    const BIN_ID = "6af91a2effd5d16053c23e4f";
    const MASTER_KEY = "$2a$10$dtvPP5l9uDR5mU9t4wLGSuzZAfDsw.HrD/G0wW0mXruYItprbBDC6";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    const ADMIN_PASSWORD = "admin";

    let dbData = { levels: [], discordUrl: "", tiktokUrl: "", playerPhotos: {} };
    let currentTab = "list";
    let currentLang = localStorage.getItem("gd_lang") || "en";
    let isHorizontalView = false;
    let selectedLevelObj = null;

    const i18n = {
        en: {
            title: "THE REMAKE LIST",
            tabList: "List", tabPlayers: "Players",
            addLevel: "+ Add Level",
            viewVertical: "View: Vertical", viewHorizontal: "View: Horizontal",
            noLevels: "No levels added yet.", noPlayers: "No players yet.",
            by: "By", verifiedBy: "Verified by", edit: "Edit", del: "Delete",
            copied: "ID copied!", adminOn: "Admin mode enabled!", adminOff: "Wrong password.",
            changePhotoTitle: "Change Player Photo",
            newPhotoLabel: "New Photo:",
            savePhoto: "Save Photo",
            delConfirm1: (name) => `Delete ${name} from players and level records? (Step 1/2)`,
            delConfirm2: (name) => `Are you 100% sure you want to permanently remove ${name}? (Step 2/2)`
        },
        es: {
            title: "LA REMAKE LIST",
            tabList: "Lista", tabPlayers: "Jugadores",
            addLevel: "+ Añadir Nivel",
            viewVertical: "Vista: Vertical", viewHorizontal: "Vista: Horizontal",
            noLevels: "No hay niveles añadidos.", noPlayers: "No hay jugadores.",
            by: "Por", verifiedBy: "Verificado por", edit: "Editar", del: "Eliminar",
            copied: "¡ID copiado!", adminOn: "¡Modo admin activado!", adminOff: "Contraseña incorrecta.",
            changePhotoTitle: "Cambiar Foto del Player",
            newPhotoLabel: "Nueva Foto:",
            savePhoto: "Guardar Foto",
            delConfirm1: (name) => `¿Eliminar a ${name} de los players y registros de niveles? (Paso 1/2)`,
            delConfirm2: (name) => `¿Estás seguro de borrar permanentemente a ${name}? (Paso 2/2)`
        }
    };

    const particleContainer = document.getElementById("particleContainer");
    for (let i = 0; i < 18; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = (Math.random() * 7 + 4) + "px";
        p.style.width = size;
        p.style.height = size;
        p.style.left = (Math.random() * 100) + "vw";
        p.style.animationDuration = (Math.random() * 6 + 4) + "s";
        particleContainer.appendChild(p);
    }

    let clicks = 0, clickTimer = null;
    document.getElementById("t-title").addEventListener("click", () => {
        clicks++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clicks = 0; }, 500);
        if (clicks >= 3) {
            clicks = 0;
            clearTimeout(clickTimer);
            document.getElementById("adminPassInput").value = "";
            openModal("adminAuthModal");
        }
    });

    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    function handleAdminLogin(e) {
        e.preventDefault();
        const pass = document.getElementById("adminPassInput").value;
        if (pass === ADMIN_PASSWORD) {
            localStorage.setItem("gd_is_admin", "true");
            closeModal("adminAuthModal");
            refreshUI();
            alert(i18n[currentLang].adminOn);
        } else {
            localStorage.setItem("gd_is_admin", "false");
            refreshUI();
            alert(i18n[currentLang].adminOff);
        }
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("gd_lang", lang);
        refreshUI();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById("tabListBtn").classList.toggle("active", tab === "list");
        document.getElementById("tabPlayersBtn").classList.toggle("active", tab === "players");
        document.getElementById("listViewContainer").style.display = tab === "list" ? "block" : "none";
        document.getElementById("playersViewContainer").style.display = tab === "players" ? "block" : "none";
        document.getElementById("toggleViewBtn").style.display = tab === "list" ? "inline-block" : "none";
        renderLists();
    }

    function toggleListViewMode() {
        isHorizontalView = !isHorizontalView;
        refreshUI();
    }

    function extractYouTubeId(url) {
        if (!url) return "";
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
        return m ? m[1] : "";
    }

    function fileToBase64(file) {
        return new Promise((resolve) => {
            if (!file) return resolve("");
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result || "");
            reader.onerror = () => resolve("");
            reader.readAsDataURL(file);
        });
    }

    function sanitizeBinData(raw) {
        return {
            levels: Array.isArray(raw?.levels) ? raw.levels : [],
            discordUrl: raw?.discordUrl || "",
            tiktokUrl: raw?.tiktokUrl || "",
            playerPhotos: raw?.playerPhotos && typeof raw.playerPhotos === "object" ? raw.playerPhotos : {}
        };
    }

    async function fetchCloudData() {
        try {
            const res = await fetch(`${JSONBIN_URL}/latest`, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            if (res.ok) {
                const data = await res.json();
                if (data && data.record) {
                    dbData = sanitizeBinData(data.record);
                }
            }
        } catch (err) {
            console.error(err);
        }
        refreshUI();
    }

    async function saveCloudData() {
        const cleanData = sanitizeBinData(dbData);
        dbData = cleanData;
        const payload = JSON.stringify(cleanData);
        if (payload.length > 95000) {
            alert("Cloud sync error: image or data size exceeds the free cloud limit.");
            return false;
        }
        try {
            const res = await fetch(JSONBIN_URL, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: payload
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return true;
        } catch (err) {
            alert(`Cloud sync error. Please try again. (${err.message})`);
            return false;
        }
    }

    function refreshUI() {
        const t = i18n[currentLang];
        const isAdmin = localStorage.getItem("gd_is_admin") === "true";

        document.documentElement.lang = currentLang;
        document.getElementById("btnLangUS").classList.toggle("active", currentLang === "en");
        document.getElementById("btnLangES").classList.toggle("active", currentLang === "es");
        document.getElementById("t-pagetitle").innerText = `${t.title} - GD`;
        document.getElementById("t-title").innerText = t.title;
        document.getElementById("tabListBtn").innerText = t.tabList;
        document.getElementById("tabPlayersBtn").innerText = t.tabPlayers;
        document.getElementById("addLevelBtnText").innerText = t.addLevel;
        document.getElementById("toggleViewBtn").innerText = isHorizontalView ? t.viewHorizontal : t.viewVertical;
        document.getElementById("adminActionBar").style.display = isAdmin ? "flex" : "none";

        document.getElementById("m-player-photo-title").innerText = t.changePhotoTitle;
        document.getElementById("m-player-photo-label").innerText = t.newPhotoLabel;
        document.getElementById("m-player-photo-save").innerText = t.savePhoto;

        const players = getPlayersFromLevels(dbData.levels || []);
        const dl = document.getElementById("playersDatalist");
        dl.innerHTML = "";
        players.forEach((p) => {
            const opt = document.createElement("option");
            opt.value = p.name;
            dl.appendChild(opt);
        });

        renderLists();
    }

    function getPlayersFromLevels(levels) {
        const pointsMap = {};
        levels.forEach((lvl) => {
            const pts = Math.max(10, Math.round(350 * Math.pow(0.95, lvl.rank - 1)));
            if (lvl.verifier) {
                pointsMap[lvl.verifier] = (pointsMap[lvl.verifier] || 0) + pts;
            }
            (lvl.victors || []).forEach((v) => {
                if (v) pointsMap[v] = (pointsMap[v] || 0) + Math.round(pts * 0.5);
            });
        });
        return Object.keys(pointsMap)
            .map((name) => ({ name, points: pointsMap[name] }))
            .sort((a, b) => b.points - a.points);
    }

    function renderLists() {
        const t = i18n[currentLang];
        const isAdmin = localStorage.getItem("gd_is_admin") === "true";
        const levels = [...(dbData.levels || [])].sort((a, b) => a.rank - b.rank);

        const listEl = document.getElementById("demonList");
        listEl.className = isHorizontalView ? "lista-horizontal" : "lista-vertical";
        listEl.innerHTML = levels.length ? "" : `<p style="text-align:center; color:var(--text-muted);">${t.noLevels}</p>`;

        levels.forEach((lvl) => {
            const pts = Math.max(10, Math.round(350 * Math.pow(0.95, lvl.rank - 1)));
            const ytId = extractYouTubeId(lvl.youtubeUrl);
            const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : "";
            const card = document.createElement("div");
            card.className = "level-card";
            card.style.setProperty("--card-bg-img", `url('${thumb}')`);
            card.onclick = (e) => { if (e.target.tagName !== "BUTTON") openLevelDetail(lvl, thumb); };
            card.innerHTML = `
                ${thumb ? `<img src="${thumb}" class="thumbnail">` : ""}
                <div class="level-info">
                    <h3 class="level-title"><span style="color:var(--accent);">#${lvl.rank}</span> ${lvl.name}</h3>
                    <p class="level-creator">${t.by} ${lvl.creator} • ${t.verifiedBy} ${lvl.verifier} ${lvl.usesNong ? '• <strong style="color:#ffcc00;">NONG</strong>' : ""}</p>
                </div>
                <div class="level-points">${pts} pts</div>
                ${isAdmin ? `
                    <div class="level-actions">
                        <button type="button" class="btn btn-edit" onclick="openEditLevel('${lvl.id}')">${t.edit}</button>
                        <button type="button" class="btn btn-danger" style="padding:6px 12px; font-size:0.85rem;" onclick="deleteLevel('${lvl.id}')">${t.del}</button>
                    </div>
                ` : ""}
            `;
            listEl.appendChild(card);
        });

        const playersEl = document.getElementById("playersList");
        playersEl.innerHTML = "";
        const players = getPlayersFromLevels(levels);
        playersEl.innerHTML = players.length ? "" : `<p style="text-align:center; color:var(--text-muted);">${t.noPlayers}</p>`;

        players.forEach((p, idx) => {
            const photo = (dbData.playerPhotos && dbData.playerPhotos[p.name]) || "https://via.placeholder.com/48";
            const row = document.createElement("div");
            row.className = "player-card";
            row.innerHTML = `
                <div class="player-rank">#${idx + 1}</div>
                <img src="${photo}" class="player-avatar" onerror="this.src='https://via.placeholder.com/48'">
                <div class="player-info">
                    <h3 class="player-name">${p.name}</h3>
                    <p class="player-details">${p.points} pts</p>
                </div>
                <div class="player-points">${p.points} pts</div>
                ${isAdmin ? `
                    <div class="player-actions">
                        <button type="button" class="btn btn-edit" onclick="openEditPlayerPhoto('${encodeURIComponent(p.name)}')">${t.edit}</button>
                        <button type="button" class="btn btn-danger" style="padding:6px 12px; font-size:0.85rem;" onclick="deletePlayerTwice('${encodeURIComponent(p.name)}')">${t.del}</button>
                    </div>
                ` : ""}
            `;
            playersEl.appendChild(row);
        });
    }

    function openEditPlayerPhoto(encodedName) {
        if (localStorage.getItem("gd_is_admin") !== "true") return;
        const name = decodeURIComponent(encodedName);
        document.getElementById("editPlayerNameKey").value = name;
        document.getElementById("editPlayerNameDisplay").innerText = name;
        document.getElementById("playerPhotoFile").value = "";
        openModal("editPlayerPhotoModal");
    }

    async function handleSavePlayerPhoto(e) {
        e.preventDefault();
        if (localStorage.getItem("gd_is_admin") !== "true") return;
        const name = document.getElementById("editPlayerNameKey").value;
        const file = document.getElementById("playerPhotoFile").files[0];
        if (!name || !file) return;

        const base64 = await fileToBase64(file);
        if (!base64) return;

        const prevPhoto = dbData.playerPhotos[name];
        dbData.playerPhotos[name] = base64;
        if (await saveCloudData()) {
            closeModal("editPlayerPhotoModal");
            refreshUI();
        } else {
            if (prevPhoto) dbData.playerPhotos[name] = prevPhoto;
            else delete dbData.playerPhotos[name];
        }
    }

    async function deletePlayerTwice(encodedName) {
        if (localStorage.getItem("gd_is_admin") !== "true") return;
        const name = decodeURIComponent(encodedName);
        const t = i18n[currentLang];

        if (!confirm(t.delConfirm1(name))) return;
        if (!confirm(t.delConfirm2(name))) return;

        const prevLevels = JSON.parse(JSON.stringify(dbData.levels || []));
        const prevPhoto = dbData.playerPhotos[name];

        dbData.levels = (dbData.levels || []).map((lvl) => ({
            ...lvl,
            verifier: lvl.verifier === name ? "" : lvl.verifier,
            victors: Array.isArray(lvl.victors) ? lvl.victors.filter((v) => v !== name) : []
        }));
        delete dbData.playerPhotos[name];

        if (await saveCloudData()) {
            refreshUI();
        } else {
            dbData.levels = prevLevels;
            if (prevPhoto) dbData.playerPhotos[name] = prevPhoto;
        }
    }

    function handleDiscordClick() {
        if (localStorage.getItem("gd_is_admin") === "true") {
            document.getElementById("discordUrlInput").value = dbData.discordUrl || "";
            openModal("discordModal");
        } else if (dbData.discordUrl) {
            window.open(dbData.discordUrl, "_blank");
        }
    }

    async function handleSaveDiscordUrl(e) {
        e.preventDefault();
        dbData.discordUrl = document.getElementById("discordUrlInput").value.trim();
        if (await saveCloudData()) { closeModal("discordModal"); refreshUI(); }
    }

    function handleTiktokClick() {
        if (localStorage.getItem("gd_is_admin") === "true") {
            document.getElementById("tiktokUrlInput").value = dbData.tiktokUrl || "";
            openModal("tiktokModal");
        } else if (dbData.tiktokUrl) {
            window.open(dbData.tiktokUrl, "_blank");
        }
    }

    async function handleSaveTiktokUrl(e) {
        e.preventDefault();
        dbData.tiktokUrl = document.getElementById("tiktokUrlInput").value.trim();
        if (await saveCloudData()) { closeModal("tiktokModal"); refreshUI(); }
    }

    async function handleAddNewLevel(e) {
        e.preventDefault();
        const newLvl = {
            id: "lvl_" + Date.now(),
            name: document.getElementById("lvlName").value.trim(),
            creator: document.getElementById("lvlCreator").value.trim(),
            verifier: document.getElementById("lvlVerifier").value.trim(),
            levelId: document.getElementById("lvlId").value.trim(),
            rank: Number(document.getElementById("lvlRank").value),
            youtubeUrl: document.getElementById("lvlYoutube").value.trim(),
            usesNong: document.getElementById("lvlNongSelect").value === "yes",
            victors: []
        };
        dbData.levels.push(newLvl);
        if (await saveCloudData()) {
            e.target.reset();
            closeModal("addLevelModal");
            refreshUI();
        } else {
            dbData.levels.pop();
        }
    }

    function openEditLevel(id) {
        const lvl = dbData.levels.find((x) => x.id === id);
        if (!lvl) return;
        document.getElementById("editLvlIdKey").value = lvl.id;
        document.getElementById("editLvlName").value = lvl.name;
        document.getElementById("editLvlCreator").value = lvl.creator;
        document.getElementById("editLvlVerifier").value = lvl.verifier;
        document.getElementById("editLvlCodeId").value = lvl.levelId;
        document.getElementById("editLvlRank").value = lvl.rank;
        document.getElementById("editLvlYoutube").value = lvl.youtubeUrl;
        document.getElementById("editLvlNongSelect").value = lvl.usesNong ? "yes" : "no";
        openModal("editLevelModal");
    }

    async function handleEditLevel(e) {
        e.preventDefault();
        const id = document.getElementById("editLvlIdKey").value;
        const lvl = dbData.levels.find((x) => x.id === id);
        if (!lvl) return;
        lvl.name = document.getElementById("editLvlName").value.trim();
        lvl.creator = document.getElementById("editLvlCreator").value.trim();
        lvl.verifier = document.getElementById("editLvlVerifier").value.trim();
        lvl.levelId = document.getElementById("editLvlCodeId").value.trim();
        lvl.rank = Number(document.getElementById("editLvlRank").value);
        lvl.youtubeUrl = document.getElementById("editLvlYoutube").value.trim();
        lvl.usesNong = document.getElementById("editLvlNongSelect").value === "yes";
        if (await saveCloudData()) { closeModal("editLevelModal"); refreshUI(); }
    }

    async function deleteLevel(id) {
        const prev = [...dbData.levels];
        dbData.levels = dbData.levels.filter((x) => x.id !== id);
        if (await saveCloudData()) { refreshUI(); } else { dbData.levels = prev; }
    }

    function openLevelDetail(lvl, thumb) {
        selectedLevelObj = lvl;
        const isAdmin = localStorage.getItem("gd_is_admin") === "true";
        document.getElementById("modalLevelTitle").innerText = lvl.name;
        document.getElementById("modalLevelCreators").innerHTML = `${i18n[currentLang].by} ${lvl.creator} • ${i18n[currentLang].verifiedBy} ${lvl.verifier}`;
        document.getElementById("modalYoutubeAnchor").href = lvl.youtubeUrl || "#";
        document.getElementById("modalYoutubeThumbImg").src = thumb || "https://via.placeholder.com/460x190";
        document.getElementById("modalLevelIdText").innerText = `ID: ${lvl.levelId}`;
        document.getElementById("addVictorBtn").style.display = isAdmin ? "inline-block" : "none";
        renderVictors();
        openModal("levelDetailModal");
    }

    function renderVictors() {
        const isAdmin = localStorage.getItem("gd_is_admin") === "true";
        const box = document.getElementById("modalVictorsList");
        box.innerHTML = "";
        (selectedLevelObj?.victors || []).forEach((v) => {
            const badge = document.createElement("div");
            badge.className = "victor-badge";
            badge.innerHTML = `<span>${v}</span>${isAdmin ? `<span class="victor-del" onclick="removeVictor('${v}')">×</span>` : ""}`;
            box.appendChild(badge);
        });
    }

    async function handleAddVictor() {
        if (!selectedLevelObj) return;
        const name = prompt("Victor name:")?.trim();
        if (!name) return;
        selectedLevelObj.victors = selectedLevelObj.victors || [];
        if (!selectedLevelObj.victors.includes(name)) {
            selectedLevelObj.victors.push(name);
            if (await saveCloudData()) { renderVictors(); refreshUI(); }
        }
    }

    async function removeVictor(name) {
        if (!selectedLevelObj) return;
        selectedLevelObj.victors = (selectedLevelObj.victors || []).filter((x) => x !== name);
        if (await saveCloudData()) { renderVictors(); refreshUI(); }
    }

    function copyLevelId() {
        if (!selectedLevelObj) return;
        navigator.clipboard.writeText(selectedLevelObj.levelId).then(() => alert(i18n[currentLang].copied));
    }

    fetchCloudData();
</script>
</body>
</html>
