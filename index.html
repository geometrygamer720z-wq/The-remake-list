<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t-pagetitle">La Remake List - GD</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --accent: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            overflow-x: hidden; position: relative; min-height: 100vh;
        }

        .gd-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        .particle {
            position: absolute; bottom: -50px;
            background: rgba(0, 210, 255, 0.15); border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        header {
            background-color: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100;
            flex-wrap: wrap; gap: 10px;
        }

        .header-left { display: flex; flex-direction: column; gap: 4px; }
        .title-row { display: flex; align-items: center; gap: 15px; }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; color: var(--accent); }

        .header-controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }

        .nav-tabs {
            display: flex; background: #111; border-radius: 6px;
            border: 1px solid #333; overflow: hidden; margin-right: 10px;
        }

        .nav-tab-btn {
            background: transparent; color: var(--text-muted); border: none;
            padding: 6px 14px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        .nav-tab-btn.active { background: var(--accent); color: #000; }

        .lang-group { display: flex; background: #111; border-radius: 6px; border: 1px solid #333; overflow: hidden; }
        .lang-btn { background: transparent; color: var(--text-muted); border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .lang-btn.active { background: var(--accent); color: #000; }

        .btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white; border: none; padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-weight: bold; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-copy { background: #222; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }

        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }

        .admin-action-bar { display: none; justify-content: flex-end; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

        .level-card, .player-card, .person-card {
            display: flex; align-items: center; background-color: var(--card-bg);
            margin-bottom: 12px; padding: 12px; border-radius: 10px;
            border-left: 4px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .thumbnail { width: 110px; height: 62px; object-fit: cover; border-radius: 6px; margin-right: 15px; background: #000; flex-shrink: 0; }
        .level-info, .player-info, .person-info { flex-grow: 1; }
        .level-title, .player-name, .person-name { font-size: 1.2rem; font-weight: bold; margin: 0 0 4px 0; }
        .level-creator, .player-details, .person-details { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
        .level-points { font-weight: bold; color: #00ffcc; font-size: 1.1rem; margin-left: 15px; }
        .level-actions, .person-actions { display: flex; gap: 8px; margin-left: 15px; align-items: center; }

        .person-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 15px; background: #333; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #141414; border: 1px solid #333; padding: 25px; border-radius: 14px;
            max-width: 450px; width: 90%; position: relative; max-height: 90vh; overflow-y: auto;
        }

        .close-btn { position: absolute; top: 12px; right: 18px; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: white; box-sizing: border-box; font-size: 0.95rem; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        
        .profile-preview { display: flex; align-items: center; gap: 12px; background: #1c1c1c; padding: 8px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a2a; }
        .avatar-circle { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #333; }
        
        .image-source-selector { background: #1c1c1c; padding: 14px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .modal-yt-container { position: relative; width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 2px solid #333; }
        .modal-yt-thumb { width: 100%; height: 200px; object-fit: cover; display: block; }
        .modal-yt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .play-icon-circle { width: 60px; height: 60px; background: #ff0000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .play-triangle { width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 20px solid #fff; margin-left: 4px; }
    </style>
</head>
<body>

<div class="gd-particles" id="particleContainer"></div>

<header>
    <div class="header-left">
        <div class="title-row">
            <h1 id="t-title">LA REMAKE LIST</h1>
        </div>
    </div>
    <div class="header-controls">
        <div class="nav-tabs">
            <button class="nav-tab-btn active" id="tabListBtn" onclick="switchTab('list')">List</button>
            <button class="nav-tab-btn" id="tabPlayersBtn" onclick="switchTab('players')">Players</button>
            <button class="nav-tab-btn" id="tabPersonsBtn" onclick="switchTab('persons')">Persons</button>
        </div>

        <div class="lang-group">
            <button class="lang-btn active" onclick="setLanguage('es', this)">ES</button>
            <button class="lang-btn" onclick="setLanguage('en', this)">US</button>
            <button class="lang-btn" onclick="setLanguage('ru', this)">RU</button>
        </div>
        <div id="authContainer">
            <button class="btn" id="loginBtn" onclick="openAuthModal()">Iniciar sesión</button>
        </div>
    </div>
</header>

<div class="container">
    <div id="adminActionBar" class="admin-action-bar">
        <button class="btn" onclick="openAddLevelModal()">+ Añadir Nivel</button>
    </div>

    <div id="listViewContainer"><div id="demonList"></div></div>
    <div id="playersViewContainer" style="display: none;"><div id="playersList"></div></div>
    <div id="personsViewContainer" style="display: none;"><div id="personsList"></div></div>
</div>

<div id="addLevelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAddLevelModal()">&times;</span>
        <h3 style="margin-top:0; color:var(--accent); font-size: 1.3rem;">Añadir Nivel</h3>
        <form id="levelForm" onsubmit="handleAddNewLevel(event)">
            <input type="text" id="lvlName" placeholder="Nombre del nivel" required>
            <input type="text" id="lvlCreator" placeholder="Creador" required>
            <input type="text" id="lvlVerifier" placeholder="Verificador" required>
            <input type="text" id="lvlId" placeholder="ID del nivel de Geometry Dash" required>
            <input type="number" id="lvlRank" placeholder="Puesto en el Top (Ej: 1)" required>
            <input type="url" id="lvlYoutube" placeholder="URL del video de YouTube" required>

            <div class="image-source-selector">
                <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--accent);">Categoría de Imágenes:</label>
                <select id="imageSourceType" onchange="toggleImageSourceInputs()" style="margin-bottom:10px;">
                    <option value="youtube">Usar miniatura de YouTube</option>
                    <option value="custom">Subir imagen personalizada</option>
                </select>
                <div id="customImageContainer" style="display:none;">
                    <input type="file" id="lvlLogoFile" accept="image/*" style="color: var(--text-muted);">
                </div>
            </div>
            <button type="submit" class="btn" style="width:100%; padding: 12px;">Añadir Nivel a la Lista</button>
        </form>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAuthModal()">&times;</span>
        <h2 style="margin-top:0;">Iniciar Sesión / Registrarse</h2>
        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <label>Tu Nombre de Usuario en GD:</label>
            <input type="text" id="authName" required placeholder="Introducir">
            <label>Contraseña:</label>
            <input type="password" id="authPass" required placeholder="••••••••">
            <label>Sube tu imagen de perfil:</label>
            <input type="file" id="authImgFile" accept="image/*" style="color: var(--text-muted); margin-bottom: 15px;">
            <button type="submit" class="btn" style="width:100%; padding: 12px;">Continuar</button>
        </form>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeProfileModal()">&times;</span>
        <h2 style="margin-top:0;">Editar Perfil</h2>
        <form id="profileForm" onsubmit="handleProfileUpdate(event)">
            <label>Tu Nombre de Usuario en GD:</label>
            <input type="text" id="profileName" required>
            <label>Nueva Contraseña (opcional):</label>
            <input type="password" id="profilePass" placeholder="Dejar en blanco para mantener">
            <label>Cambiar imagen de perfil:</label>
            <input type="file" id="profileImgFile" accept="image/*" style="color: var(--text-muted); margin-bottom: 15px;">
            <button type="submit" class="btn" style="width:100%; margin-bottom:10px; padding: 12px;">Actualizar Perfil</button>
            <button type="button" class="btn btn-danger" onclick="deleteAccount()" style="width:100%; padding: 12px;">Eliminar Cuenta</button>
        </form>
    </div>
</div>

<div id="levelDetailModal" class="modal">
    <div class="modal-content" style="text-align: center;">
        <span class="close-btn" onclick="closeDetailModal()">&times;</span>
        <h3 id="modalLevelTitle" style="color:var(--accent); margin-top:0;"></h3>
        <p id="modalLevelCreators" style="color:var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;"></p>
        <a id="modalYoutubeAnchor" href="#" target="_blank" style="text-decoration: none;">
            <div class="modal-yt-container">
                <img id="modalYoutubeThumbImg" src="" class="modal-yt-thumb" alt="YouTube Thumbnail">
                <div class="modal-yt-overlay">
                    <div class="play-icon-circle"><div class="play-triangle"></div></div>
                    <span style="color: #fff; font-weight: bold; margin-top: 8px; font-size: 0.85rem;">Ver video en YouTube</span>
                </div>
            </div>
        </a>
        <div style="background:#1c1c1c; padding: 12px 15px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold;" id="modalLevelIdText">ID: </span>
            <button class="btn-copy" onclick="copyLevelId()">Copiar ID</button>
        </div>
    </div>
</div>

<script>
    const BIN_ID = "6af91a2effd5d16053c23e4f";
    const MASTER_KEY = "$2a$10$rEXcAt7DiTo1qjWclq7hoOOYciqND75Ww3q9jhHenELrejQYvPNr6";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let dbData = {
        levels: [],
        manualPlayers: [],
        discordUrl: "",
        accounts: {}
    };

    let currentActiveTab = 'list';

    async function fetchCloudData() {
        try {
            const res = await fetch(JSONBIN_URL + "/latest", {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            if (res.ok) {
                const json = await res.json();
                if (json && json.record) {
                    dbData = json.record;
                }
            }
        } catch (err) {
            console.error("Error al conectar con JSONBin:", err);
        }
        checkLocalStorageSession();
        loadDataAndRender();
    }

    async function saveCloudData() {
        try {
            const res = await fetch(JSONBIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(dbData)
            });
            if (!res.ok) throw new Error("Error en la respuesta del servidor");
        } catch (err) {
            console.error("Error al guardar en JSONBin:", err);
            alert("Error al sincronizar con la nube. Revisa tu conexión.");
        }
    }

    window.switchTab = (tab) => {
        currentActiveTab = tab;
        document.getElementById('tabListBtn').classList.toggle('active', tab === 'list');
        document.getElementById('tabPlayersBtn').classList.toggle('active', tab === 'players');
        document.getElementById('tabPersonsBtn').classList.toggle('active', tab === 'persons');
        
        document.getElementById('listViewContainer').style.display = tab === 'list' ? 'block' : 'none';
        document.getElementById('playersViewContainer').style.display = tab === 'players' ? 'block' : 'none';
        document.getElementById('personsViewContainer').style.display = tab === 'persons' ? 'block' : 'none';
        loadDataAndRender();
    };

    const particleContainer = document.getElementById('particleContainer');
    for (let i = 0; i < 22; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 4 + 'px';
        p.style.width = size; p.style.height = size;
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 6 + 4) + 's';
        particleContainer.appendChild(p);
    }

    function extractYouTubeId(url) {
        if (!url) return '';
        let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
        return match ? match[1] : url;
    }

    function checkLocalStorageSession() {
        const activeUser = localStorage.getItem('gd_active_user');
        const authContainer = document.getElementById('authContainer');
        const adminActionBar = document.getElementById('adminActionBar');

        // Es admin automáticamente si el usuario activo es exactamente 'samurandomer'
        const isAdmin = (activeUser === 'samurandomer');

        if (adminActionBar) {
            adminActionBar.style.display = isAdmin ? 'flex' : 'none';
        }

        if (activeUser && dbData.accounts && dbData.accounts[activeUser]) {
            const profile = dbData.accounts[activeUser];
            let avatarHtml = `<img src="${profile.imageBase64 || 'https://via.placeholder.com/34'}" class="avatar-circle" onerror="this.src='https://via.placeholder.com/34'">`;

            authContainer.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="profile-preview" onclick="openProfileModal()">
                        ${avatarHtml}
                        <span style="font-size:0.9rem; font-weight:bold;">${profile.name}</span>
                    </div>
                    <button class="btn btn-danger" onclick="logoutProfile()" style="padding:6px 10px; font-size:0.8rem;">Cerrar sesión</button>
                </div>
            `;
        } else {
            authContainer.innerHTML = `<button class="btn" id="loginBtn" onclick="openAuthModal()">Iniciar sesión</button>`;
        }
    }

    window.openAuthModal = () => { document.getElementById('authModal').style.display = 'flex'; };
    window.closeAuthModal = () => { document.getElementById('authModal').style.display = 'none'; };

    window.handleAuthSubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('authName').value.trim();
        const pass = document.getElementById('authPass').value;
        const fileInput = document.getElementById('authImgFile');

        if (!dbData.accounts) dbData.accounts = {};

        const processLogin = async (imgBase64) => {
            if (dbData.accounts[name]) {
                if (dbData.accounts[name].pass === pass) {
                    localStorage.setItem('gd_active_user', name);
                    if (!imgBase64 && dbData.accounts[name].imageBase64) {
                        imgBase64 = dbData.accounts[name].imageBase64;
                    }
                    dbData.accounts[name].imageBase64 = imgBase64 || dbData.accounts[name].imageBase64 || '';
                } else {
                    alert("Contraseña incorrecta.");
                    return;
                }
            } else {
                dbData.accounts[name] = { name, pass, imageBase64: imgBase64 || '' };
                localStorage.setItem('gd_active_user', name);
            }
            await saveCloudData();
            closeAuthModal();
            checkLocalStorageSession();
            loadDataAndRender();
        };

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async function(ev) { await processLogin(ev.target.result); };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            await processLogin(dbData.accounts[name] ? dbData.accounts[name].imageBase64 : '');
        }
    };

    window.logoutProfile = () => {
        localStorage.removeItem('gd_active_user');
        checkLocalStorageSession();
        loadDataAndRender();
    };

    window.openProfileModal = () => {
        const activeUser = localStorage.getItem('gd_active_user');
        if (activeUser && dbData.accounts[activeUser]) {
            document.getElementById('profileName').value = dbData.accounts[activeUser].name;
            document.getElementById('profilePass').value = "";
        }
        document.getElementById('profileModal').style.display = 'flex';
    };
    window.closeProfileModal = () => { document.getElementById('profileModal').style.display = 'none'; };

    window.handleProfileUpdate = async (e) => {
        e.preventDefault();
        const activeUser = localStorage.getItem('gd_active_user');
        if (!activeUser || !dbData.accounts[activeUser]) return;

        const newPass = document.getElementById('profilePass').value;
        const fileInput = document.getElementById('profileImgFile');

        if (newPass) {
            dbData.accounts[activeUser].pass = newPass;
        }

        const updateDataWithImg = async (imgBase64) => {
            if (imgBase64) {
                dbData.accounts[activeUser].imageBase64 = imgBase64;
            }
            await saveCloudData();
            closeProfileModal();
            checkLocalStorageSession();
            loadDataAndRender();
            alert("¡Perfil actualizado con éxito!");
        };

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async function(ev) { await updateDataWithImg(ev.target.result); };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            await updateDataWithImg(dbData.accounts[activeUser].imageBase64);
        }
    };

    window.deleteAccount = async () => {
        const activeUser = localStorage.getItem('gd_active_user');
        if (!activeUser) return;
        if (confirm("¿Estás seguro de eliminar tu cuenta?")) {
            delete dbData.accounts[activeUser];
            localStorage.removeItem('gd_active_user');
            await saveCloudData();
            closeProfileModal();
            checkLocalStorageSession();
            loadDataAndRender();
        }
    };

    window.openAddLevelModal = () => { document.getElementById('addLevelModal').style.display = 'flex'; };
    window.closeAddLevelModal = () => { document.getElementById('addLevelModal').style.display = 'none'; };

    window.toggleImageSourceInputs = () => {
        const val = document.getElementById('imageSourceType').value;
        document.getElementById('customImageContainer').style.display = (val === 'custom') ? 'block' : 'none';
    };

    window.handleAddNewLevel = async (e) => {
        e.preventDefault();
        const name = document.getElementById('lvlName').value.trim();
        const creator = document.getElementById('lvlCreator').value.trim();
        const verifier = document.getElementById('lvlVerifier').value.trim();
        const levelId = document.getElementById('lvlId').value.trim();
        const rank = Number(document.getElementById('lvlRank').value);
        const youtubeUrl = document.getElementById('lvlYoutube').value.trim();
        const imageSource = document.getElementById('imageSourceType').value;
        const fileInput = document.getElementById('lvlLogoFile');

        const newLevel = { id: 'lvl_' + Date.now(), name, creator, verifier, levelId, rank, youtubeUrl, imageSource, logoBase64: '' };

        const saveIt = async (logo) => {
            newLevel.logoBase64 = logo || '';
            if (!dbData.levels) dbData.levels = [];
            dbData.levels.push(newLevel);
            await saveCloudData();
            closeAddLevelModal();
            loadDataAndRender();
            alert("¡Nivel añadido y sincronizado para todos en la nube!");
        };

        if (imageSource === 'custom' && fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async function(ev) { await saveIt(ev.target.result); };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            await saveIt('');
        }
    };

    window.deleteLevel = async (id) => {
        if (confirm("¿Eliminar este nivel para todos?")) {
            dbData.levels = dbData.levels.filter(l => l.id !== id);
            await saveCloudData();
            loadDataAndRender();
        }
    };

    window.deleteRegisteredPerson = async (username) => {
        if (confirm(`¿Eliminar la cuenta de ${username}?`)) {
            delete dbData.accounts[username];
            await saveCloudData();
            loadDataAndRender();
        }
    };

    function loadDataAndRender() {
        const activeUser = localStorage.getItem('gd_active_user');
        const isAdmin = (activeUser === 'samurandomer');
        let levels = dbData.levels || [];
        levels.sort((a, b) => a.rank - b.rank);

        if (currentActiveTab === 'list') {
            const container = document.getElementById('demonList');
            container.innerHTML = levels.length === 0 ? "<p style='text-align:center; color:var(--text-muted); margin-top:40px;'>No hay niveles añadidos todavía.</p>" : "";
            
            levels.forEach(lvl => {
                const points = Math.max(10, Math.round(350 * Math.pow(0.95, lvl.rank - 1)));
                const ytId = extractYouTubeId(lvl.youtubeUrl);
                const thumbUrl = (lvl.imageSource === 'custom' && lvl.logoBase64) ? lvl.logoBase64 : (ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : '');

                const card = document.createElement('div');
                card.className = 'level-card';
                card.onclick = (e) => { if (e.target.tagName !== 'BUTTON') openDetailModal(lvl, thumbUrl); };

                card.innerHTML = `
                    ${thumbUrl ? `<img src="${thumbUrl}" class="thumbnail">` : ''}
                    <div class="level-info">
                        <h3 class="level-title"><span style="color:var(--accent);">#${lvl.rank}</span> ${lvl.name}</h3>
                        <p class="level-creator">Por ${lvl.creator} • Verificado por ${lvl.verifier}</p>
                    </div>
                    <div class="level-points">${points} pts</div>
                    ${isAdmin ? `<div class="level-actions"><button class="btn btn-danger" style="padding:6px 12px; font-size:0.85rem;" onclick="deleteLevel('${lvl.id}')">Eliminar</button></div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        if (currentActiveTab === 'persons') {
            const container = document.getElementById('personsList');
            container.innerHTML = "";
            const accountsArr = Object.values(dbData.accounts || {});

            if (accountsArr.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--text-muted); margin-top:40px;'>No hay personas registradas aún.</p>";
                return;
            }

            accountsArr.forEach(person => {
                const card = document.createElement('div');
                card.className = 'person-card';
                card.innerHTML = `
                    <img src="${person.imageBase64 || 'https://via.placeholder.com/45'}" class="person-avatar" onerror="this.src='https://via.placeholder.com/45'">
                    <div class="person-info">
                        <h3 class="person-name">${person.name}</h3>
                        <p class="person-details">Cuenta activa en la nube</p>
                    </div>
                    ${isAdmin ? `<div class="person-actions"><button class="btn btn-danger" style="padding:6px 12px; font-size:0.85rem;" onclick="deleteRegisteredPerson('${person.name}')">Eliminar Cuenta</button></div>` : ''}
                `;
                container.appendChild(card);
            });
        }
    }

    window.openDetailModal = (lvl, thumbUrl) => {
        document.getElementById('modalLevelTitle').innerText = lvl.name;
        document.getElementById('modalLevelCreators').innerText = `Por ${lvl.creator} • Verificado por ${lvl.verifier}`;
        document.getElementById('modalLevelIdText').innerText = `ID: ${lvl.levelId}`;
        document.getElementById('modalYoutubeAnchor').href = lvl.youtubeUrl;
        document.getElementById('modalYoutubeThumbImg').src = thumbUrl || 'https://via.placeholder.com/480x360';
        window.selectedLevelIdForCopy = lvl.levelId;
        document.getElementById('levelDetailModal').style.display = 'flex';
    };

    window.closeDetailModal = () => { document.getElementById('levelDetailModal').style.display = 'none'; };
    window.copyLevelId = () => { navigator.clipboard.writeText(window.selectedLevelIdForCopy).then(() => alert("¡ID copiado!")); };

    fetchCloudData();
</script>
</body>
</html>
