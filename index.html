<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t-pagetitle">La Remake List - GD</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --accent: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Partículas de GD de fondo */
        .gd-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -50px;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        header {
            background-color: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; color: var(--accent); }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botones de Idioma */
        .lang-group {
            display: flex;
            background: #111;
            border-radius: 6px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--accent);
            color: #000;
        }

        .btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-edit { background: linear-gradient(135deg, #f7b733, #f39c12); color: #000; padding: 5px 10px; font-size: 0.8rem; }
        .btn-copy { background: #222; color: var(--accent); border: 1px solid var(--accent); padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }
        .btn-copy:hover { background: var(--accent); color: #000; }

        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }

        /* Botón Flotante "+" para Admin */
        .fab-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 999;
            transition: transform 0.2s;
        }
        .fab-btn:hover { transform: scale(1.1); }

        /* Tarjetas de Niveles */
        .level-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .level-card:hover { transform: scale(1.01); }
        .thumbnail { width: 110px; height: 62px; object-fit: cover; border-radius: 6px; margin-right: 15px; background: #000; flex-shrink: 0; }
        .level-info { flex-grow: 1; }
        .level-title { font-size: 1.2rem; font-weight: bold; margin: 0 0 4px 0; }
        .level-creator { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
        .level-points { font-weight: bold; color: #00ffcc; font-size: 1.1rem; margin-left: 15px; }
        .level-actions { display: flex; gap: 8px; margin-left: 15px; align-items: center; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #141414;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn { position: absolute; top: 12px; right: 18px; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; border-radius: 6px; border: 1px solid #333; background: #0a0a0a; color: white; box-sizing: border-box; }
        
        .profile-preview { display: flex; align-items: center; gap: 12px; background: #1c1c1c; padding: 8px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a2a; }
        .avatar-circle { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #333; }
        
        .image-source-selector {
            background: #1c1c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<!-- Fondo de partículas flotantes (estilo GD) -->
<div class="gd-particles" id="particleContainer"></div>

<header>
    <h1 id="t-title">LA REMAKE LIST</h1>
    <div class="header-controls">
        <!-- Botones de Idioma -->
        <div class="lang-group">
            <button class="lang-btn active" onclick="setLanguage('es', this)">ES</button>
            <button class="lang-btn" onclick="setLanguage('en', this)">US</button>
            <button class="lang-btn" onclick="setLanguage('ru', this)">RU</button>
        </div>
        <div id="authContainer">
            <button class="btn" id="loginBtn" onclick="openAuthModal()">Iniciar sesión</button>
        </div>
    </div>
</header>

<div class="container">
    <!-- Lista principal de niveles -->
    <div id="demonList"></div>
</div>

<!-- Botón Flotante "+" (Solo visible para la cuenta Admin asignada) -->
<button class="fab-btn" id="fabAddBtn" onclick="openAddLevelModal()" style="display: none;">+</button>

<!-- Modal Añadir Nivel (Admin Mini Ventana) -->
<div id="addLevelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAddLevelModal()">&times;</span>
        <h3 id="t-addlevelmodaltitle" style="margin-top:0; color:var(--accent);">Añadir Nivel</h3>
        <form id="levelForm" onsubmit="handleAddNewLevel(event)">
            <input type="text" id="lvlName" placeholder="Nombre del nivel" required>
            <input type="text" id="lvlCreator" placeholder="Creador" required>
            <input type="text" id="lvlVerifier" placeholder="Verificador" required>
            <input type="text" id="lvlId" placeholder="ID del nivel de Geometry Dash" required>
            <input type="number" id="lvlRank" placeholder="Puesto en el Top (Ej: 1)" required>
            <input type="url" id="lvlYoutube" placeholder="URL del video de YouTube" required>

            <!-- Categoría de Imágenes Exclusiva -->
            <div class="image-source-selector">
                <label id="t-imgsource" style="display:block; margin-bottom:8px; font-weight:bold; color:var(--accent);">Categoría de Imágenes:</label>
                <select id="imageSourceType" onchange="toggleImageSourceInputs()" style="margin-bottom:10px;">
                    <option value="youtube" id="t-optyt">Usar miniatura de YouTube</option>
                    <option value="custom" id="t-optcustom">Subir imagen personalizada</option>
                </select>

                <div id="customImageContainer" style="display:none;">
                    <label id="t-levellogo" style="display:block; margin-bottom:5px; color:var(--text-muted); font-size:0.9rem;">Seleccionar archivo de imagen:</label>
                    <input type="file" id="lvlLogoFile" accept="image/*" style="color: var(--text-muted);">
                </div>
            </div>

            <button type="submit" class="btn" id="t-addbtn" style="width:100%;">Añadir Nivel a la Lista</button>
        </form>
    </div>
</div>

<!-- Modal Principal de Autenticación / Registro / Inicio de Sesión -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAuthModal()">&times;</span>
        <h2 id="t-authmodaltitle" style="margin-top:0;">Iniciar Sesión / Registrarse</h2>
        <form id="authForm">
            <label id="t-authname">Tu Nombre de Usuario en GD:</label>
            <input type="text" id="authName" required placeholder="Introducir">

            <label id="t-authpass">Contraseña:</label>
            <input type="password" id="authPass" required placeholder="••••••••">

            <div id="fileUploadContainer">
                <label id="t-authimg">Sube tu imagen de perfil:</label>
                <input type="file" id="authImgFile" accept="image/*" style="color: var(--text-muted);">
            </div>

            <button type="submit" class="btn" id="t-authsubmit" style="width:100%; margin-top:10px;">Continuar</button>
        </form>
    </div>
</div>

<!-- Modal para Editar / Gestionar Perfil Activo -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeProfileModal()">&times;</span>
        <h2 id="t-profiletitle" style="margin-top:0;">Editar Perfil</h2>
        <form id="profileForm">
            <label id="t-profilename">Tu Nombre de Usuario en GD:</label>
            <input type="text" id="profileName" required>

            <label id="t-profilepass">Nueva Contraseña (opcional):</label>
            <input type="password" id="profilePass" placeholder="Dejar en blanco para mantener">

            <label id="t-profileimg">Cambiar imagen de perfil:</label>
            <input type="file" id="profileImgFile" accept="image/*" style="color: var(--text-muted);">

            <button type="submit" class="btn" id="t-saveprofile" style="width:100%; margin-top:10px;">Actualizar Perfil</button>
            <button type="button" class="btn btn-danger" id="t-deleteprofile" onclick="deleteAccount()" style="width:100%; margin-top:10px;">Eliminar Cuenta</button>
        </form>
    </div>
</div>

<!-- Modal para Editar Nivel (Admin) -->
<div id="editLevelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeEditModal()">&times;</span>
        <h3 style="margin-top:0; color:var(--accent);" id="t-editleveltitle">Editar Nivel</h3>
        <form id="editLevelForm" onsubmit="handleEditLevel(event)">
            <input type="hidden" id="editLvlDocId">
            <input type="text" id="editLvlName" placeholder="Nombre del nivel" required>
            <input type="text" id="editLvlCreator" placeholder="Creador" required>
            <input type="text" id="editLvlVerifier" placeholder="Verificador" required>
            <input type="text" id="editLvlId" placeholder="ID del nivel" required>
            <input type="number" id="editLvlRank" placeholder="Puesto en el Top" required>
            <input type="url" id="editLvlYoutube" placeholder="URL del video de YouTube" required>
            
            <div class="image-source-selector" style="margin-top: 10px;">
                <label id="t-editimgsource" style="display:block; margin-bottom:8px; font-weight:bold; color:var(--accent);">Categoría de Imágenes:</label>
                <select id="editImageSourceType" onchange="toggleEditImageSourceInputs()" style="margin-bottom:10px;">
                    <option value="youtube" id="t-editoptyt">Usar miniatura de YouTube</option>
                    <option value="custom" id="t-editoptcustom">Subir imagen personalizada</option>
                </select>

                <div id="editCustomImageContainer" style="display:none;">
                    <label id="t-editlevellogo" style="display:block; margin-bottom:5px; color:var(--text-muted); font-size:0.9rem;">Cambiar imagen de presentación:</label>
                    <input type="file" id="editLvlLogoFile" accept="image/*" style="color: var(--text-muted);">
                </div>
            </div>

            <button type="submit" class="btn" id="t-updatebtn" style="width:100%; margin-top:10px;">Guardar Cambios</button>
        </form>
    </div>
</div>

<!-- Modal para Ver Detalles / ID / Copiar ID -->
<div id="levelDetailModal" class="modal">
    <div class="modal-content" style="text-align: center;">
        <span class="close-btn" onclick="closeDetailModal()">&times;</span>
        <h3 id="modalLevelTitle" style="color:var(--accent); margin-top:0;"></h3>
        <p id="modalLevelCreators" style="color:var(--text-muted); font-size: 0.9rem;"></p>
        
        <div style="background:#1c1c1c; padding: 15px; border-radius: 8px; margin: 15px 0; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold;" id="modalLevelIdText">ID: </span>
            <button class="btn-copy" id="t-copybtn" onclick="copyLevelId()">Copiar ID</button>
        </div>

        <a id="modalYoutubeLink" href="#" target="_blank" class="btn" style="display: block; text-decoration: none; text-align: center;" id="t-watchyt">Ver video en YouTube</a>
    </div>
</div>

    window.setLanguage = (lang, btnElement) => {

        const logoutBtnEl = document.getElementById('logoutBtn');
        if (logoutBtnEl) logoutBtnEl.innerText = translations[lang].logout;

        loadLevels();
    };

    // Partículas de fondo
    const particleContainer = document.getElementById('particleContainer');
    for (let i = 0; i < 22; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 4 + 'px';
        p.style.width = size;
        p.style.height = size;
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 6 + 4) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's';
        particleContainer.appendChild(p);
    }

    function extractYouTubeId(url) {
        if (!url) return '';
        let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
        return match ? match[1] : url;
    }

    // Alternar campos según la categoría de imagen seleccionada
    window.toggleImageSourceInputs = () => {
        const type = document.getElementById('imageSourceType').value;
        document.getElementById('customImageContainer').style.display = (type === 'custom') ? 'block' : 'none';
    };

    window.toggleEditImageSourceInputs = () => {
        const type = document.getElementById('editImageSourceType').value;
        document.getElementById('editCustomImageContainer').style.display = (type === 'custom') ? 'block' : 'none';
    };

    function checkLocalStorageSession() {
        const activeUser = localStorage.getItem('gd_active_user');
        const allAccounts = JSON.parse(localStorage.getItem('gd_accounts') || '{}');
        const adminAccount = localStorage.getItem('gd_admin_account');
        const authContainer = document.getElementById('authContainer');
        const fabAddBtn = document.getElementById('fabAddBtn');

        if (activeUser && allAccounts[activeUser]) {
            const profile = allAccounts[activeUser];
            let avatarHtml = `<img src="${profile.imageBase64 || 'https://via.placeholder.com/34'}" class="avatar-circle" onerror="this.src='https://via.placeholder.com/34'">`;

            const isThisAccountAdmin = (adminAccount === activeUser);

            if (isThisAccountAdmin) {
                fabAddBtn.style.display = 'flex';
            } else {
                fabAddBtn.style.display = 'none';
            }

            authContainer.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="profile-preview" onclick="openProfileModal()">
                        ${avatarHtml}
                        <span style="font-size:0.9rem; font-weight:bold;">${profile.name}</span>
                    </div>
                    <button class="btn btn-danger" onclick="logoutProfile()" style="padding:6px 10px; font-size:0.8rem;">${translations[currentLang].logout}</button>
                </div>
            `;
        } else {
            authContainer.innerHTML = `<button class="btn" id="loginBtn" onclick="openAuthModal()">${translations[currentLang].login}</button>`;
            fabAddBtn.style.display = 'none';
        }
        loadLevels();
    }

    window.openAuthModal = () => {
        document.getElementById('authName').value = "";
        document.getElementById('authPass').value = "";
        document.getElementById('authImgFile').value = "";
        document.getElementById('authModal').style.display = 'flex';
    };

    window.closeAuthModal = () => {
        document.getElementById('authModal').style.display = 'none';
    };

    document.getElementById('authForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('authName').value.trim();
        const pass = document.getElementById('authPass').value;
        const fileInput = document.getElementById('authImgFile');

        let allAccounts = JSON.parse(localStorage.getItem('gd_accounts') || '{}');

        if (allAccounts[name]) {
            if (allAccounts[name].pass === pass) {
                localStorage.setItem('gd_active_user', name);
                closeAuthModal();
                checkLocalStorageSession();
            } else {
                alert("Contraseña incorrecta para esta cuenta.");
            }
        } else {
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                if (!file.type.startsWith('image/')) {
                    alert("Por favor selecciona un archivo de imagen válido.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    registerNewAccount(name, pass, uploadEvent.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                registerNewAccount(name, pass, '');
            }
        }
    });

    function registerNewAccount(name, pass, imageBase64) {
        let allAccounts = JSON.parse(localStorage.getItem('gd_accounts') || '{}');
        allAccounts[name] = { name, pass, imageBase64 };
        localStorage.setItem('gd_accounts', JSON.stringify(allAccounts));
        localStorage.setItem('gd_active_user', name);
        closeAuthModal();
        checkLocalStorageSession();
    }

    window.openProfileModal = () => {
        const activeUser = localStorage.getItem('gd_active_user');
        const allAccounts = JSON.parse(localStorage.getItem('gd_accounts') || '{}');
        if (activeUser && allAccounts[activeUser]) {
            const profile = allAccounts[activeUser];
            document.getElementById('profileName').value = profile.name;
            document.getElementById('profilePass').value = "";
            document.getElementById('profileImgFile').value = "";
            document.getElementById('profileModal').style.display = 'flex';
        }
    };

    window.closeProfileModal = () => {
        document.getElementById('profileModal').style.display = 'none';
    };

    document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const activeUser = localStorage.getItem('gd_active_user');
        let allAccounts = JSON.parse(localStorage.getItem('gd_accounts') || '{}');
        if (!activeUser || !allAccounts[activeUser]) return;

        const newName = document.getElementById('profileName').value.trim();
        const newPass = document.getElementById('profilePass').value;
        const fileInput = document.getElementById('profileImgFile');
        let currentImage = allAccounts[activeUser].imageBase64;

        if (fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            if (!file.type.startsWith('image/')) {
                alert("Por favor selecciona un archivo de imagen válido.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                updateAccountData(activeUser, newName, newPass, uploadEvent.target.result, allAccounts);
            };
            reader.readAsDataURL(file);
        } else {
            updateAccountData(activeUser, newName, newPass, currentImage, allAccounts);
        }
    });

    function updateAccountData(oldName, newName, newPass, imageBase64, allAccounts) {
        let profileData = allAccounts[oldName];
        profileData.name = newName;
        profileData.imageBase64 = imageBase64;
        if (newPass.trim() !== "") {
            profileData.pass = newPass;
        }

        if (oldName !== newName) {
            delete allAccounts[oldName];
            if (localStorage.getItem('gd_admin_account') === oldName) {
                localStorage.setItem('gd_admin_account', newName);
            }
        }
        allAccounts[newName] = profileData;

        localStorage.setItem('gd_accounts', JSON.stringify(allAccounts));
        localStorage.setItem('gd_active_user', newName);
        closeProfileModal();
        checkLocalStorageSession();
    }

    window.deleteAccount = () => {
        if (confirm("¿Estás seguro de que deseas eliminar esta cuenta permanentemente?")) {
            const activeUser = localStorage.getItem('gd_active_user');
            let allAccounts = JSON.parse(localStorage.getItem('gd_accounts') || '{}');
            if (activeUser && allAccounts[activeUser]) {
                delete allAccounts[activeUser];
                localStorage.setItem('gd_accounts', JSON.stringify(allAccounts));
            }
            if (localStorage.getItem('gd_admin_account') === activeUser) {
                localStorage.removeItem('gd_admin_account');
            }
            localStorage.removeItem('gd_active_user');
            closeProfileModal();
            checkLocalStorageSession();
            location.reload();
        }
    };

    window.logoutProfile = () => {
        localStorage.removeItem('gd_active_user');
        checkLocalStorageSession();
        location.reload();
    };

    // Control de la mini ventana de añadir nivel (Botón "+")
    window.openAddLevelModal = () => {
        document.getElementById('levelForm').reset();
        document.getElementById('imageSourceType').value = 'youtube';
        toggleImageSourceInputs();
        document.getElementById('addLevelModal').style.display = 'flex';
    };

    window.closeAddLevelModal = () => {
        document.getElementById('addLevelModal').style.display = 'none';
    };

    // Añadir Nivel Robusto con procesamiento seguro de archivos
    window.handleAddNewLevel = async (event) => {
        event.preventDefault();
        const activeUser = localStorage.getItem('gd_active_user');
        const adminAccount = localStorage.getItem('gd_admin_account');
        if (adminAccount !== activeUser) {
            alert("No tienes permisos de administrador.");
            return;
        }

        const name = document.getElementById('lvlName').value.trim();
        const creator = document.getElementById('lvlCreator').value.trim();
        const verifier = document.getElementById('lvlVerifier').value.trim();
        const levelId = document.getElementById('lvlId').value.trim();
        const rank = Number(document.getElementById('lvlRank').value);
        const youtubeUrl = document.getElementById('lvlYoutube').value.trim();
        const imageSource = document.getElementById('imageSourceType').value;
        const fileInput = document.getElementById('lvlLogoFile');

        const levelData = {
            name, creator, verifier, levelId, rank, youtubeUrl, imageSource, logoBase64: ''
        };

        if (imageSource === 'custom' && fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            if (!file.type.startsWith('image/')) {
                alert("Por favor selecciona un archivo de imagen válido.");
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                levelData.logoBase64 = uploadEvent.target.result;
                await commitLevelToFirestore(levelData);
            };
            reader.readAsDataURL(file);
        } else {
            await commitLevelToFirestore(levelData);
        }
    };

    async function commitLevelToFirestore(levelData) {
        try {
            await addDoc(collection(db, "levels"), levelData);
            closeAddLevelModal();
            document.getElementById('levelForm').reset();
            loadLevels();
            alert("¡Nivel añadido con éxito!");
        } catch (err) {
            console.error("Error al añadir nivel:", err);
            alert("Error al añadir el nivel: " + err.message);
        }
    }

    // Editar Nivel Robusto con procesamiento seguro de archivos
    window.handleEditLevel = async (event) => {
        event.preventDefault();
        const activeUser = localStorage.getItem('gd_active_user');
        const adminAccount = localStorage.getItem('gd_admin_account');
        if (adminAccount !== activeUser) {
            alert("No tienes permisos de administrador.");
            return;
        }

        const docId = document.getElementById('editLvlDocId').value;
        const name = document.getElementById('editLvlName').value.trim();
        const creator = document.getElementById('editLvlCreator').value.trim();
        const verifier = document.getElementById('editLvlVerifier').value.trim();
        const levelId = document.getElementById('editLvlId').value.trim();
        const rank = Number(document.getElementById('editLvlRank').value);
        const youtubeUrl = document.getElementById('editLvlYoutube').value.trim();
        const imageSource = document.getElementById('editImageSourceType').value;
        const fileInput = document.getElementById('editLvlLogoFile');

        const updateData = {
            name, creator, verifier, levelId, rank, youtubeUrl, imageSource
        };

        if (imageSource === 'custom' && fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            if (!file.type.startsWith('image/')) {
                alert("Por favor selecciona un archivo de imagen válido.");
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                updateData.logoBase64 = uploadEvent.target.result;
                await commitUpdateToFirestore(docId, updateData);
            };
            reader.readAsDataURL(file);
        } else {
            if (imageSource === 'youtube') {
                updateData.logoBase64 = '';
            }
            await commitUpdateToFirestore(docId, updateData);
        }
    };

    async function commitUpdateToFirestore(docId, updateData) {
        try {
            const levelRef = doc(db, "levels", docId);
            await updateDoc(levelRef, updateData);
            closeEditModal();
            loadLevels();
            alert("¡Nivel actualizado con éxito!");
        } catch (err) {
            console.error("Error al actualizar nivel:", err);
            alert("Error al actualizar el nivel: " + err.message);
        }
    }

    // Funcionalidad de Niveles y Renderizado
    async function loadLevels() {
        const listContainer = document.getElementById('demonList');
        const activeUser = localStorage.getItem('gd_active_user');
        const adminAccount = localStorage.getItem('gd_admin_account');
        const isAdmin = (adminAccount === activeUser);

        try {
            const q = query(collection(db, "levels"), orderBy("rank", "asc"));
            const querySnapshot = await getDocs(q);
            
            listContainer.innerHTML = "";
            if (querySnapshot.empty) {
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const docId = docSnap.id;
                const lvl = docSnap.data();
                const points = Math.max(10, Math.round(350 * Math.pow(0.95, lvl.rank - 1)));
                
                const ytId = extractYouTubeId(lvl.youtubeUrl);
                const ytThumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : '';
                const thumbUrl = (lvl.imageSource === 'custom' && lvl.logoBase64) ? lvl.logoBase64 : ytThumb;
                
                const tr = translations[currentLang];

                const card = document.createElement('div');
                card.className = 'level-card';
                card.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    openDetailModal(lvl.name, lvl.creator, lvl.verifier, lvl.levelId, lvl.youtubeUrl);
                };

                let adminButtonsHtml = '';
                if (isAdmin) {
                    adminButtonsHtml = `
                        <div class="level-actions">
                            <button type="button" class="btn btn-edit" onclick="openEditModal('${docId}', '${encodeURIComponent(lvl.name || '')}', '${encodeURIComponent(lvl.creator || '')}', '${encodeURIComponent(lvl.verifier || '')}', '${lvl.levelId || ''}', '${encodeURIComponent(lvl.youtubeUrl || '')}', ${lvl.rank || 1}, '${lvl.imageSource || 'youtube'}')">${tr.editbtntext}</button>
                            <button type="button" class="btn btn-danger" style="padding:5px 10px; font-size:0.8rem;" onclick="deleteLevel('${docId}')">${tr.deletebtntext}</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${thumbUrl ? `<img src="${thumbUrl}" class="thumbnail">` : ''}
                    <div class="level-info">
                        <h3 class="level-title"><span style="color:var(--accent);">#${lvl.rank}</span> ${lvl.name}</h3>
                        <p class="level-creator">${tr.by} ${lvl.creator} • ${tr.verifiedBy} ${lvl.verifier}</p>
                    </div>
                    <div class="level-points">${points} pts</div>
                    ${adminButtonsHtml}
                `;
                listContainer.appendChild(card);
            });
        } catch (e) {
            console.error(e);
            listContainer.innerHTML = "<p style='text-align:center; color:red;'>Error al cargar los niveles.</p>";
        }
    }

    // Modal de Detalle de Nivel
    window.openDetailModal = (name, creator, verifier, levelId, youtubeUrl) => {
        document.getElementById('modalLevelTitle').innerText = name;
        document.getElementById('modalLevelCreators').innerText = `Por ${creator} • Verificado por ${verifier}`;
        document.getElementById('modalLevelIdText').innerText = `ID: ${levelId}`;
        document.getElementById('modalYoutubeLink').href = youtubeUrl;
        selectedLevelIdForCopy = levelId;
        document.getElementById('levelDetailModal').style.display = 'flex';
    };

    window.closeDetailModal = () => {
        document.getElementById('levelDetailModal').style.display = 'none';
    };

    window.copyLevelId = () => {
        navigator.clipboard.writeText(selectedLevelIdForCopy).then(() => {
            alert("¡ID copiado al portapapeles!");
        }).catch(err => {
            console.error("Error al copiar: ", err);
        });
    };

    // Funciones para abrir Modales de Edición
    window.openEditModal = (docId, name, creator, verifier, levelId, youtubeUrl, rank, imageSource) => {
        document.getElementById('editLvlDocId').value = docId;
        document.getElementById('editLvlName').value = decodeURIComponent(name);
        document.getElementById('editLvlCreator').value = decodeURIComponent(creator);
        document.getElementById('editLvlVerifier').value = decodeURIComponent(verifier);
        document.getElementById('editLvlId').value = levelId;
        document.getElementById('editLvlYoutube').value = decodeURIComponent(youtubeUrl);
        document.getElementById('editLvlRank').value = rank;
        document.getElementById('editImageSourceType').value = imageSource || 'youtube';
        toggleEditImageSourceInputs();
        document.getElementById('editLvlLogoFile').value = "";
        document.getElementById('editLevelModal').style.display = 'flex';
    };

    window.closeEditModal = () => {
        document.getElementById('editLevelModal').style.display = 'none';
    };

    window.deleteLevel = async (docId) => {
        const activeUser = localStorage.getItem('gd_active_user');
        const adminAccount = localStorage.getItem('gd_admin_account');
        if (adminAccount !== activeUser) return;

        if (confirm("¿Estás seguro de que deseas eliminar este nivel de la lista?")) {
            try {
                await deleteDoc(doc(db, "levels", docId));
                loadLevels();
                alert("Nivel eliminado correctamente.");
            } catch (err) {
                console.error("Error al eliminar nivel: ", err);
                alert("Error al eliminar el nivel.");
            }
        }
    };

    checkLocalStorageSession();
</script>
</body>
</html>
